<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乐高套装收藏</title>
  <!-- CSS 样式 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HTML 结构 -->
  <section class="login-overlay" id="login-overlay" aria-labelledby="login-title">
    <form class="login-card" id="login-form" novalidate>
      <p class="eyebrow">乐高套装收藏</p>
      <h1 id="login-title">欢迎回来</h1>
      <p class="login-intro">输入用户名，进入你的个人收藏空间。</p>
      <label for="login-username">用户名</label>
      <input id="login-username" name="username" type="text" autocomplete="username"
        required aria-describedby="login-error">
      <label for="login-password">密码</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password"
        required aria-describedby="login-error">
      <p class="login-error" id="login-error" aria-live="polite"></p>
      <button class="primary-button" type="submit">登录</button>
    </form>
  </section>

  <main class="app" id="app-main" hidden>
    <header class="page-header">
      <div>
        <p class="eyebrow">我的收藏</p>
        <h1>乐高套装收藏</h1>
        <p class="intro">记录每一盒套装，随时查看收藏与拼搭进度。</p>
      </div>
      <div class="user-bar">
        <span>当前用户：<strong id="current-user"></strong></span>
        <button class="logout-button" id="logout-button" type="button">登出</button>
      </div>
    </header>

    <div class="stats-section">
      <section class="stats-grid" aria-label="收藏统计">
        <div class="stat-card">
          <p class="stat-label">套装总数</p>
          <p class="stat-value" id="stat-total">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">总零件数</p>
          <p class="stat-value" id="stat-pieces">0</p>
        </div>
        <div class="stat-card">
          <p class="stat-label">总花费</p>
          <p class="stat-value" id="stat-cost">¥0.00</p>
        </div>
      </section>
      <div class="backup-actions">
        <button class="backup-button" id="export-json" type="button">导出 JSON</button>
        <button class="backup-button" id="export-csv" type="button">导出 CSV</button>
        <button class="backup-button" id="import-data" type="button">导入 JSON</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
    </div>
    <p class="backup-message" id="backup-message" aria-live="polite"></p>

    <div class="content-grid">
      <section class="panel form-panel" aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">添加记录</p>
            <h2 id="form-title">新增套装</h2>
          </div>
        </div>

        <form id="set-form" novalidate>
          <div class="field">
            <label for="name">名称 <span aria-hidden="true">*</span></label>
            <input id="name" name="name" type="text" autocomplete="off"
              aria-describedby="name-error">
            <p class="field-error" id="name-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="number">编号 <span aria-hidden="true">*</span></label>
            <input id="number" name="number" type="text" autocomplete="off"
              aria-describedby="number-error">
            <p class="field-error" id="number-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="series">系列 <span aria-hidden="true">*</span></label>
            <select id="series" name="series" required aria-describedby="series-error">
              <option value="City">City</option>
              <option value="Icons">Icons</option>
              <option value="Star Wars">Star Wars</option>
              <option value="Technic">Technic</option>
              <option value="Creator">Creator</option>
              <option value="Ideas">Ideas</option>
              <option value="其他">其他</option>
            </select>
            <label for="custom-series" id="custom-series-label" hidden>自定义系列名称</label>
            <input id="custom-series" name="customSeries" type="text" autocomplete="off"
              placeholder="请输入自定义系列名称" aria-describedby="series-error" hidden>
            <p class="field-error" id="series-error" aria-live="polite"></p>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="piece-count">零件数 <span aria-hidden="true">*</span></label>
              <input id="piece-count" name="pieceCount" type="text" inputmode="numeric"
                autocomplete="off" aria-describedby="piece-count-error">
              <p class="field-error" id="piece-count-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="price">入手价</label>
              <div class="input-with-prefix">
                <span aria-hidden="true">¥</span>
                <input id="price" name="price" type="text" inputmode="decimal"
                  autocomplete="off" aria-describedby="price-error">
              </div>
              <p class="field-error" id="price-error" aria-live="polite"></p>
            </div>
          </div>

          <div class="field">
            <label for="status">状态</label>
            <select id="status" name="status">
              <option value="未拼装">未拼装</option>
              <option value="拼装中">拼装中</option>
              <option value="已完成">已完成</option>
            </select>
          </div>

          <div class="field">
            <label for="notes">备注</label>
            <textarea id="notes" name="notes" rows="3"
              aria-describedby="notes-error"></textarea>
            <p class="field-error" id="notes-error" aria-live="polite"></p>
          </div>

          <p class="form-message" id="form-message" aria-live="polite"></p>
          <button class="primary-button" type="submit">保存套装</button>
        </form>
      </section>

      <section class="panel collection-panel" aria-labelledby="collection-title">
        <div class="section-heading collection-heading">
          <div>
            <p class="eyebrow">收藏清单</p>
            <h2 id="collection-title">我的套装</h2>
          </div>
          <span class="collection-count" id="collection-count">0 件</span>
        </div>
        <div class="filter-controls">
          <div class="field">
            <label for="collection-search">搜索名称或编号</label>
            <input id="collection-search" type="search" autocomplete="off"
              placeholder="输入套装名称或编号">
          </div>
          <div class="field">
            <label for="series-filter">按系列筛选</label>
            <select id="series-filter">
              <option value="">全部系列</option>
            </select>
          </div>
        </div>
        <div id="collection-list" class="collection-list" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <!-- JavaScript 逻辑 -->
  <script src="app.js"></script>
</body>
</html>
